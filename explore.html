<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استكشف الموديلز | منصة الموديلز</title>
  <meta name="description" content="تصفح قائمة الموديلز والعارضين المحترفين واستعرض تفاصيلهم وسابقة أعمالهم.">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Style -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 10px;">
        <img src="kitchen1.png" alt="Production Kitchen Logo" class="logo-img" style="height: 40px; width: auto; border-radius: 8px;">
        <span style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.25rem; letter-spacing: 0.5px; color: var(--gold-primary);">برودكشن كتشن</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">الرئيسية</a></li>
        <li><a href="explore.html" class="nav-link active">استكشف الموديلز</a></li>
      </ul>

      <div class="nav-actions">
        <button class="btn btn-outline-gold" id="navAuthBtn">
          <i class="fa-solid fa-user"></i>
          <span>تسجيل الدخول</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-wrapper">
    <div class="container">
      <!-- Page Header -->
      <div class="section-header" style="text-align: right; margin-bottom: 32px;">
        <h1 class="section-title">دليل <span class="gold-text">الموديلز والعارضين</span></h1>
        <p class="section-desc">دور على أشطر المواهب، وكلمهم مباشر على الواتساب</p>
      </div>

      <!-- Filter Controls -->
      <div class="filter-wrapper">
        <div class="filter-grid">
          <!-- Search Input -->
          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-magnifying-glass"></i> دور بالاسم أو الوصف</label>
            <input type="text" id="searchInput" class="input-control" placeholder="اكتب اسم، تخصص، أو أي كلمة...">
          </div>

          <!-- Category Select -->
          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-layer-group"></i> التخصص</label>
            <select id="categoryFilter" class="input-control">
              <option value="">كل التخصصات</option>
              <option value="عروض أزياء">عروض أزياء</option>
              <option value="إعلانات تجارية">إعلانات تجارية</option>
              <option value="جلسات تصوير">جلسات تصوير</option>
              <option value="فيديو كليب">فيديو كليب</option>
            </select>
          </div>

          <!-- City Select -->
          <div class="form-group">
            <label class="form-label"><i class="fa-solid fa-location-dot"></i> المدينة</label>
            <select id="cityFilter" class="input-control">
              <option value="">كل المدن</option>
              <option value="الرياض">الرياض</option>
              <option value="جدة">جدة</option>
              <option value="الدمام">الدمام</option>
              <option value="الخبر">الخبر</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Model Cards Grid -->
      <div class="models-grid" id="exploreModelsGrid">
        <!-- Dynamically rendered model cards -->
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-logo" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
      <img src="kitchen1.png" alt="Production Kitchen Logo" style="height: 32px; width: auto; border-radius: 6px;">
      <span style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.25rem; letter-spacing: 0.5px; color: var(--gold-primary);">برودكشن كتشن</span>
    </div>
    <p>جميع الحقوق محفوظة © 2026 - برودكشن كتشن</p>
  </footer>

  <!-- Auth Modal Dialog -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <div class="modal-close" id="modalCloseBtn">
        <i class="fa-solid fa-xmark"></i>
      </div>

      <div class="modal-tabs">
        <div class="modal-tab active" id="tabLogin">تسجيل الدخول</div>
        <div class="modal-tab" id="tabRegister">اعمل حساب جديد</div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label">الإيميل</label>
          <input type="email" id="loginEmail" class="input-control" placeholder="اكتب الإيميل" required>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label">كلمة السر</label>
          <input type="password" id="loginPassword" class="input-control" placeholder="اكتب كلمة السر" required>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%;">
          <span>ادخل على حسابك</span>
          <i class="fa-solid fa-arrow-left"></i>
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form" style="display: none;">
        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label">الاسم بالكامل</label>
          <input type="text" id="regFullName" class="input-control" placeholder="اكتب اسمك بالكامل" required>
        </div>

        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label">الإيميل</label>
          <input type="email" id="regEmail" class="input-control" placeholder="اكتب الإيميل" required>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label">كلمة السر</label>
          <input type="password" id="regPassword" class="input-control" placeholder="اكتب كلمة سر قوية" required>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%;">
          <span>اعمل حساب جديد</span>
          <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Supabase CDN JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Configuration & Script -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
