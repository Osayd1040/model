<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بروفايل الموديل | منصة الموديلز</title>
  <meta name="description" content="استعرض السيرة الذاتية، المقاسات، ومعرض الأعمال للموديل وتواصل معاه مباشرة على الواتساب.">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Style -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo" style="display: flex; align-items: center; gap: 10px;">
        <img src="kitchen1.png" alt="Production Kitchen Logo" class="logo-img" style="height: 40px; width: auto; border-radius: 8px;">
        <span style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.25rem; letter-spacing: 0.5px; color: var(--gold-primary);">برودكشن كتشن</span>
      </a>

      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">الرئيسية</a></li>
        <li><a href="explore.html" class="nav-link">استكشف الموديلز</a></li>
      </ul>

      <div class="nav-actions">
        <button class="btn btn-outline-gold" id="navAuthBtn">
          <i class="fa-solid fa-user"></i>
          <span>تسجيل الدخول</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main-wrapper">
    <div class="container">
      
      <!-- Back Navigation Button -->
      <div style="margin-bottom: 24px;">
        <a href="explore.html" class="btn btn-outline-gold" style="padding: 8px 16px; font-size: 0.875rem;">
          <i class="fa-solid fa-arrow-right"></i>
          <span>ارجع لقائمة الموديلز</span>
        </a>
      </div>

      <!-- Instagram-Style Profile Header Card -->
      <div class="profile-header-card" id="profileHeader">
        <div class="profile-hero-content">
          <!-- Avatar -->
          <div class="profile-avatar-wrapper">
            <img id="profileAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=800" alt="Model Avatar" class="profile-avatar">
          </div>

          <!-- Profile Details -->
          <div class="profile-details">
            <div class="profile-title-area">
              <h1 class="profile-name" id="profileName">جاري التحميل...</h1>
              <span class="gold-badge" id="profileBadge">
                <i class="fa-solid fa-circle-check"></i>
                <span id="profileCategory">موديل</span>
              </span>
            </div>

            <p class="profile-bio" id="profileBio">
              ...
            </p>

            <!-- Physical Stats -->
            <div class="profile-stats-grid">
              <div class="stat-item">
                <div class="stat-label">الطول</div>
                <div class="stat-value" id="profileHeight">--</div>
              </div>
              <div class="stat-item">
                <div class="stat-label">الوزن</div>
                <div class="stat-value" id="profileWeight">--</div>
              </div>
              <div class="stat-item">
                <div class="stat-label">التخصص</div>
                <div class="stat-value" id="profileStatCategory">--</div>
              </div>
              <div class="stat-item">
                <div class="stat-label">المدينة</div>
                <div class="stat-value" id="profileCity">--</div>
              </div>
            </div>

            <!-- Contact & Social Action Buttons -->
            <div class="profile-actions-bar">
              <a href="#" target="_blank" id="profileWhatsappBtn" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp" style="font-size: 1.25rem;"></i>
                <span>تواصل معايا على الواتساب</span>
              </a>

              <a href="#" target="_blank" id="profileInstaBtn" class="btn-icon btn-instagram" title="إنستجرام">
                <i class="fa-brands fa-instagram"></i>
              </a>

              <a href="#" target="_blank" id="profileTiktokBtn" class="btn-icon btn-tiktok" title="تيك توك">
                <i class="fa-brands fa-tiktok"></i>
              </a>
            </div>
          </div>
        </div>
      </div>

      <!-- Portfolio Section Header -->
      <div class="portfolio-header">
        <h2 style="font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px;">
          <i class="fa-solid fa-border-all gold-text"></i>
          <span>معرض الأعمال (البورتفوليو)</span>
        </h2>
        <span class="gold-badge" id="photoCountBadge">0 صور</span>
      </div>

      <!-- 3-Column Portfolio Grid -->
      <div class="portfolio-grid" id="portfolioGrid">
        <!-- Dynamic Portfolio Items -->
      </div>
    </div>
  </main>

  <!-- Lightbox Modal for Photo View -->
  <div class="lightbox" id="lightboxModal">
    <div class="lightbox-close" id="lightboxCloseBtn">
      <i class="fa-solid fa-xmark"></i>
    </div>
    <img src="" alt="Portfolio Image View" class="lightbox-content" id="lightboxImg">
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-logo" style="display: flex; align-items: center; justify-content: center; gap: 10px;">
      <img src="kitchen1.png" alt="Production Kitchen Logo" style="height: 32px; width: auto; border-radius: 6px;">
      <span style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.25rem; letter-spacing: 0.5px; color: var(--gold-primary);">برودكشن كتشن</span>
    </div>
    <p>جميع الحقوق محفوظة © 2026 - برودكشن كتشن</p>
  </footer>

  <!-- Auth Modal Dialog -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <div class="modal-close" id="modalCloseBtn">
        <i class="fa-solid fa-xmark"></i>
      </div>

      <div class="modal-tabs">
        <div class="modal-tab active" id="tabLogin">تسجيل الدخول</div>
        <div class="modal-tab" id="tabRegister">اعمل حساب جديد</div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form">
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label">الإيميل</label>
          <input type="email" id="loginEmail" class="input-control" placeholder="اكتب الإيميل" required>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label">كلمة السر</label>
          <input type="password" id="loginPassword" class="input-control" placeholder="اكتب كلمة السر" required>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%;">
          <span>ادخل على حسابك</span>
          <i class="fa-solid fa-arrow-left"></i>
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form" style="display: none;">
        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label">الاسم بالكامل</label>
          <input type="text" id="regFullName" class="input-control" placeholder="اكتب اسمك بالكامل" required>
        </div>

        <div class="form-group" style="margin-bottom: 14px;">
          <label class="form-label">الإيميل</label>
          <input type="email" id="regEmail" class="input-control" placeholder="اكتب الإيميل" required>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label">كلمة السر</label>
          <input type="password" id="regPassword" class="input-control" placeholder="اكتب كلمة سر قوية" required>
        </div>

        <button type="submit" class="btn btn-gold" style="width: 100%;">
          <span>اعمل حساب جديد</span>
          <i class="fa-solid fa-user-plus"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification System -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Supabase CDN JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Configuration & Script -->
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
